; ====================================================================
; Asterisk PJSIP Configuration for AI Calling Platform MVP
; Extension: 7000 (AI Receptionist)
; ====================================================================

[global]
type=global
user_agent=Asterisk-AI-Calling-MVP

; --------------------------------------------------------------------
; Transport (UDP & TCP)
; --------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; --------------------------------------------------------------------
; Extension 7000 - AI Receptionist Endpoint
; --------------------------------------------------------------------
[7000]
type=endpoint
context=ai-inbound
disallow=all
allow=ulaw
allow=alaw
allow=opus
auth=auth7000
aors=7000
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth7000]
type=auth
auth_type=userpass
password=changeme_sip_secret
username=ai-agent

[7000]
type=aor
max_contacts=5
remove_existing=yes

; --------------------------------------------------------------------
; Generic SIP Trunk Template (e.g. PSTN / IP-PBX provider)
; --------------------------------------------------------------------
[trunk-provider]
type=registration
outbound_auth=trunk-auth
server_uri=sip:sip.provider.com
client_uri=sip:YOUR_TRUNK_USER@sip.provider.com
retry_interval=60

[trunk-auth]
type=auth
auth_type=userpass
username=YOUR_TRUNK_USER
password=YOUR_TRUNK_PASSWORD

[trunk-endpoint]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw
allow=alaw
outbound_auth=trunk-auth
aors=trunk-aor
direct_media=no

[trunk-aor]
type=aor
contact=sip:sip.provider.com
