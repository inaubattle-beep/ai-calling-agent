; ====================================================================
; Asterisk Dialplan (extensions.conf)
; Routes calls to Stasis Application: ai-agent
; ====================================================================

[general]
static=yes
writeprotect=no

[ai-inbound]
; Route internal dial to 7000
exten => 7000,1,NoOp(Incoming call to AI Receptionist Extension 7000)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Stasis(ai-agent,inbound)
 same => n,Hangup()

[from-pstn]
; Route DID from PSTN trunk directly to AI Receptionist
exten => _X.,1,NoOp(Inbound PSTN Call: Caller ID=${CALLERID(num)} to DID=${EXTEN})
 same => n,Set(CHANNEL(language)=bn)
 same => n,Goto(ai-inbound,7000,1)

[ai-outbound]
; Outbound calls originated by AI platform
exten => _+X.,1,NoOp(AI Outbound call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk-endpoint,60)
 same => n,Hangup()
